name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    name: Ubuntu (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            git \
            autoconf automake libtool gettext intltool \
            pkg-config \
            flex \
            libgtk2.0-dev libglib2.0-dev \
            libreadline-dev libbluetooth-dev \
            libusb-dev libical-dev \
            libsqlite3-dev libpcsclite-dev
      - name: Configure
        run: |
          ./autogen.sh
      - name: Build
        run: |
          make -j"$(nproc)"
      - name: Test
        run: |
          make check

  debian:
    name: Debian (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [stable, testing, unstable]
    container:
      image: debian:${{ matrix.suite }}-slim
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            git \
            build-essential \
            autoconf automake libtool gettext intltool \
            pkg-config \
            flex \
            libglib2.0-dev libgtk2.0-dev \
            libreadline-dev libbluetooth-dev \
            libusb-dev libical-dev \
            libsqlite3-dev libpq-dev libmariadb-dev-compat \
            libpcsclite-dev
      - uses: actions/checkout@v6
      - name: Configure
        run: |
          ./autogen.sh
      - name: Build
        run: |
          make -j"$(nproc)"
      - name: Test
        run: |
          make check

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install build dependencies
        run: |
          brew update
          brew install autoconf automake libtool pkg-config gettext intltool flex
          brew install glib readline libusb
      - name: Configure
        env:
          PKG_CONFIG_PATH: /opt/homebrew/lib/pkgconfig:/opt/homebrew/opt/libusb/lib/pkgconfig:/opt/homebrew/opt/readline/lib/pkgconfig:/usr/local/lib/pkgconfig:/usr/local/opt/libusb/lib/pkgconfig:/usr/local/opt/readline/lib/pkgconfig
          ACLOCAL_PATH: /opt/homebrew/opt/gettext/share/aclocal:/usr/local/opt/gettext/share/aclocal
        run: |
          echo "/opt/homebrew/opt/gettext/bin" >> "$GITHUB_PATH"
          echo "/usr/local/opt/gettext/bin" >> "$GITHUB_PATH"
          ./autogen.sh
      - name: Build
        run: |
          make -j"$(sysctl -n hw.ncpu)"
      - name: Test
        run: |
          make check

  windows:
    name: Windows (MSYS2 MinGW64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6
      - name: Set up MSYS2 and install build dependencies
        uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: MINGW64
          install: >-
            git
            make
            mingw-w64-x86_64-toolchain
            autoconf
            automake
            libtool
            gettext
            intltool
            flex
            pkgconf
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-readline
      - name: Configure
        run: |
          ./autogen.sh
      - name: Build
        run: |
          make -j"$(nproc)"
      - name: Test
        run: |
          make check
